# Labels issues submitted through the extension's feedback form.
#
# The form writes a "**Category:** <value>" line at the top of the issue
# body. The extension also passes `labels` on the create call, but GitHub
# silently drops that field for users without push access, so this workflow
# re-applies the label with the repo's own token to cover external users.
# Issues without the Category line (opened manually) are left untouched.
name: Label feedback issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from the feedback category line
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/^\*\*Category:\*\*\s*(.+)$/m);
            if (!match) {
              core.info('No feedback category line found, skipping.');
              return;
            }
            const category = match[1].trim();
            const labelMap = {
              'Bug': 'bug',
              'Feature request': 'enhancement',
              'Question': 'question',
              'Other': 'feedback',
            };
            const label = labelMap[category];
            if (!label) {
              core.info(`Unknown category "${category}", skipping.`);
              return;
            }
            // The default labels always exist, but "feedback" may not —
            // create it on first use so addLabels never fails.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: '0e8a16',
                description: 'Submitted via the extension feedback form',
              });
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
