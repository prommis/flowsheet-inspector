name: Local development installation tests

on:
  pull_request:
    branches: [main]

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python dependencies
        run: |
          pip install idaes-connectivity idaes-pse
          idaes get-extensions
          pip install git+https://github.com/prommis/flowsheet-inspector-lib.git

      - name: Install webview UI dependencies
        run: npm install
        working-directory: webview_ui

      - name: Build webview UI
        run: npm run build
        working-directory: webview_ui

      - name: Install extension dependencies
        run: npm install
        working-directory: extension

      - name: Compile extension
        run: npm run compile
        working-directory: extension

      - name: Package extension
        run: |
          mkdir -p ../ci_extension_package
          npx vsce package --out ../ci_extension_package/flowsheet-inspector.vsix
        working-directory: extension

      - name: Check extension package was created
        run: node -e "const fs = require('fs'); const files = fs.readdirSync('ci_extension_package').filter(f => f.endsWith('.vsix')); if (files.length === 0) { console.error('No .vsix file found'); process.exit(1); } console.log('Found:', files);"
